    /* ------------------------------
       GLASS
    ------------------------------ */

    .glass {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.55);
    }

    /* ------------------------------
       HERO
    ------------------------------ */

    .hero {
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 72% 18%,
          rgba(91, 210, 193, 0.25),
          transparent 30%
        ),
        radial-gradient(
          circle at 15% 78%,
          rgba(233, 121, 63, 0.16),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          #061714 0%,
          #0b302b 52%,
          #0d554c 100%
        );
    }

    .grid-bg {
      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.045) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.045) 1px,
          transparent 1px
        );

      background-size: 46px 46px;
    }

    .orb {
      position: absolute;
      border-radius: 999px;
      pointer-events: none;
      filter: blur(1px);
    }

    /* ------------------------------
       3D FLOATING ELEMENTS
    ------------------------------ */

    .float {
      animation: floating 6s ease-in-out infinite;
    }

    .float-2 {
      animation: floating 7s ease-in-out -2s infinite;
    }

    .float-3 {
      animation: floating 8s ease-in-out -4s infinite;
    }

    @keyframes floating {
      0%,
      100% {
        transform:
          translate3d(0, 0, 0)
          rotate(0deg);
      }

      50% {
        transform:
          translate3d(0, -16px, 0)
          rotate(3deg);
      }
    }

    /* ------------------------------
       SHINE
    ------------------------------ */

    .shine {
      position: relative;
      overflow: hidden;
    }

    .shine::after {
      content: "";

      position: absolute;
      inset: -120% -40%;

      background:
        linear-gradient(
          110deg,
          transparent 42%,
          rgba(255, 255, 255, 0.25) 50%,
          transparent 58%
        );

      transform: translateX(-60%);
      animation: shine 5s infinite;
    }

    @keyframes shine {
      0%,
      55% {
        transform: translateX(-60%);
      }

      75%,
      100% {
        transform: translateX(60%);
      }
    }

    /* ------------------------------
       CARDS
    ------------------------------ */

    .card-3d {
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .card-3d:hover {
      transform: translateY(-7px);

      box-shadow:
        0 24px 60px rgba(7, 29, 26, 0.12);
    }

    /* ------------------------------
       REVEAL
    ------------------------------ */

    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: 0.7s ease;
    }

    .reveal.show {
      opacity: 1;
      transform: none;
    }

    /* ------------------------------
       UTILITIES
    ------------------------------ */

    .hide {
      display: none !important;
    }

    [dir="rtl"] .rtl-flip {
      transform: scaleX(-1);
    }

    input,
    select,
    textarea {
      font-family: inherit;
    }

    /* ------------------------------
       SCROLLBAR
    ------------------------------ */

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #b9c9c5;
      border-radius: 999px;
    }

    ::-webkit-scrollbar-track {
      background: #f7f8f6;
    }

    /* ------------------------------
       MOBILE
    ------------------------------ */

    @media (max-width: 768px) {
      .hero {
        min-height: auto;
      }
    }
    /* ==========================================
   SNA3TI — PREMIUM 3D HERO
========================================== */

#heroVisual {
  perspective: 1200px;
  transform-style: preserve-3d;
}

/* Main visual */

#heroVisual > div:first-child {
  transform-style: preserve-3d;
  transition:
    transform 0.7s cubic-bezier(.2,.8,.2,1),
    box-shadow 0.7s ease;
}

#heroVisual:hover > div:first-child {
  transform:
    perspective(1200px)
    rotateX(1deg)
    rotateY(-2deg)
    translateY(-5px);
}


/* ==========================================
   HERO IMAGE
========================================== */

#heroVisual img {
  transition:
    transform 1.2s cubic-bezier(.2,.8,.2,1),
    filter 1s ease;
}

#heroVisual:hover img {
  transform: scale(1.08);
  filter: saturate(1.08) contrast(1.04);
}


/* ==========================================
   FLOATING 3D ELEMENTS
========================================== */

.float {
  animation: heroFloatOne 5s ease-in-out infinite;
  transform-style: preserve-3d;
}

.float-2 {
  animation: heroFloatTwo 6s ease-in-out infinite;
  transform-style: preserve-3d;
}

.float-3 {
  animation: heroFloatThree 5.5s ease-in-out infinite;
  transform-style: preserve-3d;
}


@keyframes heroFloatOne {

  0%,
  100% {
    transform: translate3d(0, 0, 0);
  }

  50% {
    transform: translate3d(0, -12px, 12px);
  }

}


@keyframes heroFloatTwo {

  0%,
  100% {
    transform: translate3d(0, 0, 0) rotate(0deg);
  }

  50% {
    transform: translate3d(8px, -15px, 15px) rotate(2deg);
  }

}


@keyframes heroFloatThree {

  0%,
  100% {
    transform: translate3d(0, 0, 0);
  }

  50% {
    transform: translate3d(-8px, -10px, 10px);
  }

}

   GLASS EFFECT
========================================== */

#heroVisual .glass {
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  background: rgba(255, 255, 255, 0.08);

    0 20px 60px rgba(0, 0, 0, 0.25);
}


/* ==========================================
   SEARCH BAR
========================================== */

#heroForm {
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  transition:
    transform 0.3s ease,
    box-shadow 0.3s ease;
}

#heroForm:focus-within {
  transform: translateY(-2px);

  box-shadow:
    0 25px 80px rgba(0, 0, 0, 0.3);
}


/* ==========================================
   SEARCH BUTTON
========================================== */

#heroForm button {
  transition:
    transform 0.25s ease,
    filter 0.25s ease,
    box-shadow 0.25s ease;
}

#heroForm button:hover {
  transform: translateY(-2px);

    0 12px 30px rgba(0, 0, 0, 0.25);
}


/* ==========================================
   BACKGROUND ORBS
========================================== */

.hero .orb {
  filter: blur(2px);
  pointer-events: none;
}


/* ==========================================
   MOBILE
========================================== */

@media (max-width: 767px) {

  #heroVisual {
    display: none;
  }

    border-radius: 1.5rem;
  }

}


/* ==========================================
   ACCESSIBILITY
========================================== */

@media (prefers-reduced-motion: reduce) {

  .float,
  .float-2,
  .float-3 {
    animation: none !important;
  }

  #heroVisual img {
    transition: none;
  }

  #heroVisual > div:first-child {
    transition: none;
  }

}

/* ==========================================
   LANGUAGE
========================================== */

let lang = localStorage.getItem("sna3ti_lang") || "fr";


function tr(path) {

  const parts = path.split(".");

  let value = translations[lang];

  for (const part of parts) {
    value = value?.[part];
  }

  return value || path;
}


function setLanguage(newLang) {

  if (!translations[newLang]) {
    newLang = "fr";
  }

  lang = newLang;

  localStorage.setItem(
    "sna3ti_lang",
    lang
  );

  document.documentElement.lang = lang;

  document.documentElement.dir =
    lang === "ar" ? "rtl" : "ltr";

  applyTranslations();

  router();

}


function applyTranslations() {

  document
    .querySelectorAll("[data-i18n]")
    .forEach(element => {

      const key =
        element.getAttribute("data-i18n");

      const value = tr(key);

      if (value.includes("<br>")) {

        element.innerHTML = value;

      } else {

        element.textContent = value;

      }

    });

}


document.addEventListener("change", event => {

  if (
    event.target.id === "lang" ||
    event.target.id === "langMobile"
  ) {

    setLanguage(event.target.value);

  }

});


/* ==========================================
   CATEGORY HELPERS
========================================== */

function getCategory(id) {

  return categories.find(
    category => category.id === id
  );

}


function catName(id) {

  const category = getCategory(id);

  if (!category) return id;

  return category.name[lang];

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

function goSearch(service = "", place = "") {

  const params = new URLSearchParams();

  if (place) {
    params.set("place", place);
  }

  window.location.hash =
    "/services" +
    (params.toString()
      ? "?" + params.toString()
      : "");

}

function applyFilters() {

  const service =
    document.getElementById("filterService").value;

  const place =
    document.getElementById("filterPlace").value.trim();

  goSearch(service, place);

}


/* ==========================================
   SORT
========================================== */

function sortResults(type) {

  const grid =
    document.getElementById("resultsGrid");

  if (!grid) return;


  const hash =
    window.location.hash;

  const query =
    hash.includes("?")
      ? hash.split("?")[1]
      : "";

  const params =
    new URLSearchParams(query);

  const service =
    params.get("service") || "";

  const place =
    params.get("place") || "";


  let results =
    professionals.filter(pro => {

      const serviceMatch =
        !service ||
        pro.category === service;

      const placeMatch =
        !place ||
        pro.city
          .toLowerCase()
          .includes(place.toLowerCase());

      return serviceMatch && placeMatch;

    });


  if (type === "rating") {

    results.sort(
      (a, b) => b.rating - a.rating
    );

  }


  if (type === "reviews") {

    results.sort(
      (a, b) => b.reviews - a.reviews
    );

  }


  if (type === "experience") {

    results.sort(
      (a, b) =>
        parseInt(b.experience) -
        parseInt(a.experience)
    );

  }


  grid.innerHTML =
    results.length
      ? results.map(professionalCard).join("")
      : emptyState();

}

/* ==========================================
   TOAST
========================================== */

function showToast(message) {

  const toast =
    document.getElementById("toast");

  if (!toast) return;

  toast.textContent = message;

  toast.classList.remove("hidden");

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(() => {

      toast.classList.add("hidden");

    }, 3200);

}


/* ==========================================
   ROUTER
========================================== */

function router() {

  const hash =
    window.location.hash || "#/";

  const path =
    hash.split("?")[0];


  closeProfile();


  if (path === "#/" || path === "#") {

    renderHome();

    document.getElementById("app").insertAdjacentHTML(
      "beforeend",
      renderCategories() +
      renderProfessionals() +
      renderHow() +
      renderCTA()
    );

  }

  else if (path === "#/services") {

    renderSearchPage();

  }

  else if (path === "#/pricing") {

    renderPricing();

  }

  else if (path === "#/register") {

    renderRegister();

  }

  else {

    renderHome();

    document.getElementById("app").insertAdjacentHTML(
      "beforeend",
      renderCategories() +
      renderProfessionals() +
      renderHow() +
      renderCTA()
    );

  }


  document.getElementById("app").insertAdjacentHTML(
    "beforeend",
    renderFooter()
  );


  applyTranslations();

  initReveal();

  window.scrollTo({
    top: 0,
    behavior: "instant"
  });

}


/* ==========================================
   REVEAL ANIMATION
========================================== */

function initReveal() {

  const elements =
    document.querySelectorAll(".reveal");


  if (!("IntersectionObserver" in window)) {

    elements.forEach(
      element =>
        element.classList.add("show")
    );

    return;

  }


  const observer =
    new IntersectionObserver(
      entries => {

        entries.forEach(entry => {

          if (entry.isIntersecting) {

            entry.target.classList.add(
              "show"
            );

            observer.unobserve(
              entry.target
            );

          }

        });

      },
      {
        threshold: 0.08
      }
    );


  elements.forEach(
    element =>
      observer.observe(element)
  );

}
