<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sna3ti Admin — Tableau de bord</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/admin.css" />
<style>
  /* Loading placeholder shown until the modular app boots. */
  #admin-root .boot-loader { min-height:100vh; display:grid; place-items:center; background:linear-gradient(160deg,#eefaf6 0%,#f6f3ed 100%); }
  #admin-root .boot-card { text-align:center; color:var(--muted); font-size:14px; }
  #admin-root .boot-card .brand-logo { margin:0 auto 16px; }
</style>
</head>
<body>
<div id="admin-root">
  <div class="boot-loader"><div class="boot-card">
    <div class="brand-logo">S</div>
    <div>Sna3ti Administration</div>
  </div></div>
</div>

<!-- Scripts: dependency order matters.
     data -> auth -> router -> ui -> app -->
<script src="js/admin-i18n.js"></script>
<script src="js/admin-data.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-router.js"></script>
<script src="js/admin-ui.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
