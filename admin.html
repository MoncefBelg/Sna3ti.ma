function openProModal(id){

    +fm("Nom complet",'<input id="mName" value="'+esc(p.name)+'">')
    +fm("Metier",'<input id="mJob" value="'+esc(p.job)+'">')

    +fm("Ville",'<select id="mCity">'+DATA.cities.map(function(c){return '<option '+(c.name===p.city?"selected":"")+'>'+c.name+'</option>';}).join("")+'</select>')
    +'</div>'
    +fm("Zone",'<input id="mArea" value="'+esc(p.area)+'">')
    +fm("Tarif (DH)",'<input id="mPrice" type="number" value="'+p.price+'">')
    +fm("Verification",'<select id="mVer"><option value="none" '+(p.verified==="none"?"selected":"")+'>Non verifie</option><option value="identity" '+(p.verified==="identity"?"selected":"")+'>Identite</option><option value="professionnel" '+(p.verified==="professionnel"?"selected":"")+'>Professionnel</option></select>')
    +fm("Telephone",'<input id="mPhone" value="'+esc(p.phone)+'">')

function fm(label,ctl){ return '<div class="fm"><label>'+label+'</label>'+ctl+'</div>'; }
function savePro(id){
  var base={name:$("#mName").value,job:$("#mJob").value,category:$("#mCat").value,city:$("#mCity").value,area:$("#mArea").value,price:parseInt($("#mPrice").value)||0,verified:$("#mVer").value,phone:$("#mPhone").value};

  else { DATA.professionals.push({id:Date.now(),rating:0,reviews:0,available:true,image:"",distance:0,desc:"",...?{}:{},/*placeholder*/ name:"",job:"",category:"",city:"",area:"",price:0,verified:"none",phone:""}); var ob=DATA.professionals[DATA.professionals.length-1]; for(var k2 in base)ob[k2]=base[k2]; toast("Professionnel ajoute"); }

function delPro(id){
  if(confirm("Supprimer ce professionnel ?")){ DATA.professionals=DATA.professionals.filter(function(p){return p.id!==id;}); toast("Professionnel supprime"); if(VIEWS.professionals)VIEWS.professionals(); }

VIEWS.verification=function(){
  var ver=DATA.verifications;
  var html='<div class="tabs">'
    +'<button class="tab active" onclick="window.app.verTab(\'all\',this)">Toutes <span class="cnt">'+ver.length+'</span></button>'
    +'<button class="tab" onclick="window.app.verTab(\'identity\',this)">Identite <span class="cnt">'+ver.filter(function(v){return v.level==="identity";}).length+'</span></button>'
    +'<button class="tab" onclick="window.app.verTab(\'professionnel\',this)">Professionnel <span class="cnt">'+ver.filter(function(v){return v.level==="professionnel";}).length+'</span></button>'
    +'</div><div id="verList">'+pendingListAll(ver)+'</div>';

function verTab(f,el){
  $$(".tab").forEach(function(t){t.classList.remove("active");}); el.classList.add("active");
  var list=DATA.verifications;
  if(f==="identity")list=list.filter(function(v){return v.level==="identity";});
  if(f==="professionnel")list=list.filter(function(v){return v.level==="professionnel";});
  $("#verList").innerHTML=list.length?pendingListAll(list):'<div class="empty">Aucune demande</div>';
}
function approveVer(id,level){
  DATA.verifications.forEach(function(v){if(v.id===id){v.status="approved";v.trail.push(new Date().toLocaleDateString("fr-MA")+" - Approuvee (niveau "+level+")");}});
  var v=DATA.verifications.filter(function(x){return x.id===id;})[0];
  DATA.professionals.forEach(function(p){if(p.id===v.pro)p.verified=level==="professionnel"?"professionnel":"identity";});
  toast("Verification approuvee"); VIEWS.verification(); updatePills();
}
function rejectVer(id){
  DATA.verifications.forEach(function(v){if(v.id===id){v.status="rejected";v.trail.push(new Date().toLocaleDateString("fr-MA")+" - Refusee");}});
  toast("Demande refusee"); VIEWS.verification(); updatePills();
}
function openVerNote(id){
  var v=DATA.verifications.filter(function(x){return x.id===id;})[0];
  var p=DATA.professionals.filter(function(x){return x.id===v.pro;})[0];
  modal('<h3>Notes d\'audit</h3><p class="subtle">'+esc(p.name)+' — historique de verification</p><div class="timeline" style="margin:14px 0">'+v.trail.map(function(t){return '<div class="tl-item"><div class="t-txt">'+t+'</div></div>';}).join("")+'</div><div class="modal-actions"><button class="btn btn-ghost" onclick="window.app.closeModal()">Fermer</button></div>');
}

  repTab("all",$("#content .tab"));
};
function repTab(f,el){
  $$("#content .tab").forEach(function(t){t.classList.remove("active");}); if(el)el.classList.add("active");
  var list=DATA.reports;
  if(f==="pending")list=list.filter(function(r){return r.status==="pending";});
  if(f==="done")list=list.filter(function(r){return r.status==="done";});
  $("#repList").innerHTML=list.length?list.map(function(r){
    var p=DATA.professionals.filter(function(x){return x.id===r.pro;})[0];
    return '<div class="req"><div class="req-top"><div class="pro"><b>'+esc(p?p.name:"-")+'</b></div><span class="badge '+(r.status==="pending"?"amber":"green")+'" onclick="void(0)">'+r.status+'</span></div><div><b>'+esc(r.reason)+'</b><div class="subtle">'+esc(r.desc)+'<br>Signale par '+esc(r.reporter)+' le '+r.date+'</div></div>'
      +'<div class="req-actions">'+(r.status==="pending"?'<button class="btn btn-primary btn-small" onclick="window.app.resolveRep('+r.id+')">&#10004; Resoudre</button><button class="btn btn-danger btn-small" onclick="window.app.dismissRep('+r.id+')">Ignorer</button>':'<span class="badge green">Traite</span>')+'</div></div>';
  }).join(""):'<div class="empty">Aucun signalement</div>';
}
function resolveRep(id){ DATA.reports.forEach(function(r){if(r.id===id)r.status="done";}); toast("Signalement resolu"); repTab("all",$("#content .tab")); updatePills(); }
function dismissRep(id){ DATA.reports.forEach(function(r){if(r.id===id)r.status="done";}); toast("Signalement ignore"); repTab("all",$("#content .tab")); updatePills(); }

    +'<div class="card"><div class="card-head"><div class="card-title">Nouvelles inscriptions</div></div><div class="chart-bars">'+bars2+'</div></div>'
    +'</div>';
};
